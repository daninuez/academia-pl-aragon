<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcademiaPL Aragón</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #ffffff; color: #000000; }
    .login-container { min-height: 100vh; background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-box { width: 100%; max-width: 400px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .login-box h1 { font-size: 28px; font-weight: 700; color: #000000; margin-bottom: 8px; }
    .login-box p { font-size: 14px; color: #666666; margin: 0 0 40px 0; }
    label { display: block; font-size: 13px; font-weight: 500; color: #000000; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #d0d0d0; border-radius: 6px; margin-bottom: 16px; font-family: inherit; }
    input:focus { outline: none; border-color: #003366; }
    button { width: 100%; padding: 11px 16px; font-size: 14px; font-weight: 600; color: #ffffff; background: #003366; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #002244; }
    .dashboard { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .sidebar { background: #f8f8f8; border-right: 1px solid #e5e5e5; padding: 24px 0; display: flex; flex-direction: column; }
    .sidebar-header { padding-left: 20px; margin-bottom: 32px; }
    .sidebar-header h2 { font-size: 15px; font-weight: 700; color: #003366; margin: 0; }
    .sidebar-header p { font-size: 11px; color: #999999; margin: 4px 0 0 0; }
    nav { flex: 1; }
    .nav-btn { width: 100%; padding: 12px 20px; border: none; background: transparent; color: #666666; font-size: 13px; text-align: left; cursor: pointer; border-left: 3px solid transparent; font-family: inherit; }
    .nav-btn.active { background: #e8f0ff; color: #003366; font-weight: 600; border-left-color: #003366; }
    .main-content { padding: 40px; overflow-y: auto; }
    .main-content h1 { font-size: 32px; font-weight: 700; margin-bottom: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
    .card { background: #f8f8f8; border: 1px solid #e5e5e5; border-radius: 12px; padding: 24px; text-align: center; }
    .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .card p { font-size: 13px; color: #999999; margin-bottom: 16px; }
    .price { font-size: 24px; font-weight: 700; color: #003366; }
    .btn-logout { width: calc(100% - 20px); margin: 0 10px; padding: 10px 12px; border: 1px solid #d0d0d0; background: #ffffff; color: #666666; font-size: 13px; cursor: pointer; border-radius: 6px; font-family: inherit; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    class App {
      constructor() {
        this.isLoggedIn = false;
        this.currentSection = 'inicio';
        this.email = '';
        this.password = '';
        this.init();
      }
      init() { this.render(); this.attachEvents(); }
      handleLogin(e) {
        e.preventDefault();
        if (this.email && this.password) { this.isLoggedIn = true; this.render(); this.attachEvents(); }
      }
      handleLogout() { this.isLoggedIn = false; this.email = ''; this.password = ''; this.render(); this.attachEvents(); }
      setSection(section) { this.currentSection = section; this.render(); this.attachEvents(); }
      render() { const app = document.getElementById('app'); app.innerHTML = this.isLoggedIn ? this.renderDashboard() : this.renderLogin(); }
      renderLogin() {
        return `<div class="login-container"><div class="login-box"><h1>AcademiaPL Aragón</h1><p>Preparación de oposiciones</p><form id="loginForm"><label>Email</label><input type="email" id="emailInput" required><label>Contraseña</label><input type="password" id="passwordInput" required><button type="submit">Acceder</button></form><div style="border-top: 1px solid #e5e5e5; padding-top: 24px; text-align: center;"><p style="font-size: 12px; color: #999999; margin: 0;">Te acompañamos en la preparación de tu futuro</p></div></div></div>`;
      }
      renderDashboard() {
        return `<div class="dashboard"><div class="sidebar"><div class="sidebar-header"><h2>AcademiaPL</h2><p>Aragón</p></div><nav>${['inicio', 'temario', 'tests', 'practicos', 'examenes', 'contacto'].map(s => `<button class="nav-btn ${this.currentSection === s ? 'active' : ''}" data-section="${s}">${s === 'inicio' ? '📊' : s === 'temario' ? '📚' : s === 'tests' ? '✏️' : s === 'practicos' ? '🔍' : s === 'examenes' ?
