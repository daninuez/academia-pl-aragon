<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcademiaPL Aragón</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #fff; color: #000; }
.login { min-height: 100vh; background: linear-gradient(135deg, #f5f5f5 0%, #fff 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
.box { width: 100%; max-width: 400px; background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
p { font-size: 14px; color: #666; }
label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
input { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #d0d0d0; border-radius: 6px; margin-bottom: 16px; }
input:focus { outline: none; border-color: #003366; }
button { width: 100%; padding: 11px; font-size: 14px; font-weight: 600; color: #fff; background: #003366; border: none; border-radius: 6px; cursor: pointer; }
button:hover { background: #002244; }
.dashboard { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.sidebar { background: #f8f8f8; border-right: 1px solid #e5e5e5; padding: 24px 0; flex-direction: column; display: flex; }
.nav-btn { padding: 12px 20px; border: none; background: transparent; color: #666; font-size: 13px; text-align: left; cursor: pointer; border-left: 3px solid transparent; font-family: inherit; width: 100%; }
.nav-btn.active { background: #e8f0ff; color: #003366; font-weight: 600; border-left-color: #003366; }
.main { padding: 40px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; }
.card { background: #f8f8f8; border: 1px solid #e5e5e5; border-radius: 12px; padding: 24px; text-align: center; }
.price { font-size: 24px; font-weight: 700; color: #003366; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const app = {
logged: false,
section: 'inicio',
login(e) {
e.preventDefault();
if (document.getElementById('email').value && document.getElementById('pass').value) {
this.logged = true;
this.render();
}
},
logout() {
this.logged = false;
this.section = 'inicio';
this.render();
},
render() {
const root = document.getElementById('root');
if (!this.logged) {
root.innerHTML = `<div class="login"><div class="box"><h1>AcademiaPL Aragón</h1><p>Preparación de oposiciones</p><form onsubmit="app.login(event)"><label>Email</label><input id="email" type="email" required><label>Contraseña</label><input id="pass" type="password" required><button>Acceder</button></form><p style="text-align:center;margin-top:30px;font-size:12px;color:#999;">Te acompañamos en la preparación de tu futuro</p></div></div>`;
} else {
root.innerHTML = `<div class="dashboard"><div class="sidebar"><div style="padding-left:20px;margin-bottom:30px;"><h2 style="font-size:15px;color:#003366;margin:0;">AcademiaPL</h2><p style="font-size:11px;color:#999;margin:5px 0 0 0;">Aragón</p></div><nav style="flex:1;"><button class="nav-btn ${this.section==='inicio'?'active':''}" onclick="app.section='inicio';app.render();">📊 Inicio</button><button class="nav-btn ${this.section==='temario'?'active':''}" onclick="app.section='temario';app.render();">📚 Temario</button><button class="nav-btn ${this.section==='tests'?'active':''}" onclick="app.section='tests';app.render();">✏️ Tests</button><button class="nav-btn ${this.section==='practicos'?'active':''}" onclick="app.section='practicos';app.render();">🔍 Casos</button><button class="nav-btn ${this.section==='examenes'?'active':''}" onclick="app.section='examenes';app.render();">📋 Exámenes</button><button class="nav-btn ${this.section==='contacto'?'active':''}" onclick="app.section='contacto';app.render();">📧 Contacto</button></nav><div style="border-top:1px solid #e5e5e5;padding:15px 10px;"><button onclick="app.logout();" style="width:calc(100% - 10px);padding:10px;background:#fff;border:1px solid #d0d0d0;color:#666;cursor:pointer;border-radius:6px;">Cerrar sesión</button></div></div><div class="main">${this.section==='inicio'?`<h1>Bienvenido</h1><p>Te acompañamos en la preparación de tu futuro</p><div class="grid-3"><div class="card"><h3>Unificada</h3><p>Convocatoria Unificada</p><p class="price">19,99€/mes</p></div><div class="card"><h3>Unificada + Una</h3><p>Con opción municipal</p><p class="price">29,99€/mes</p></div><div class="card"><h3>Todo incluido</h3><p>Todas las oposiciones</p><p class="price">39,99€/mes</p></div></div>`:''}${this.section==='temario'?'<h1>Temario</h1><p>Descargas PDF próximamente</p>':''}${this.section==='tests'?'<h1>Generador de Tests</h1><p>Crea tests personalizados</p>':''}${this.section==='practicos'?'<h1>Casos Prácticos</h1><p>Casos resueltos próximamente</p>':''}${this.section==='examenes'?'<h1>Exámenes Oficiales</h1><p>Exámenes anteriores próximamente</p>':''}${this.section==='contacto'?'<h1>Contacto</h1><p>info@academiaplaragon.com</p>':''}</div></div>`;
}
}
};
app.render();
</script>
</body>
</html>
