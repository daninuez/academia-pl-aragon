<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcademiaPL Aragón - Preparación Oposiciones Policía Local</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #000000;
    }
    
    .login-container {
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-box {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    .login-box h1 {
      font-size: 28px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    .login-box p {
      font-size: 14px;
      color: #666666;
      margin: 0 0 40px 0;
    }
    
    form {
      margin-bottom: 24px;
    }
    
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #000000;
      margin-bottom: 6px;
    }
    
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      font-family: inherit;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    
    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #003366;
    }
    
    button[type="submit"] {
      width: 100%;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: #003366;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    button[type="submit"]:hover {
      background: #002244;
    }
    
    .login-footer {
      border-top: 1px solid #e5e5e5;
      padding-top: 24px;
      text-align: center;
    }
    
    .login-footer p {
      font-size: 12px;
      color: #999999;
      margin: 0 0 8px 0;
      line-height: 1.6;
    }
    
    .dashboard {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }
    
    .sidebar {
      background: #f8f8f8;
      border-right: 1px solid #e5e5e5;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
    }
    
    .sidebar-header {
      padding-left: 20px;
      margin-bottom: 32px;
    }
    
    .sidebar-header h2 {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      color: #003366;
      letter-spacing: -0.3px;
    }
    
    .sidebar-header p {
      font-size: 11px;
      color: #999999;
      margin: 4px 0 0 0;
    }
    
    nav {
      flex: 1;
    }
    
    .nav-btn {
      width: 100%;
      padding: 12px 20px;
      border: none;
      background: transparent;
      color: #666666;
      font-size: 13px;
      font-weight: 400;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }
    
    .nav-btn.active {
      background: #e8f0ff;
      color: #003366;
      font-weight: 600;
      border-left: 3px solid #003366;
      padding-left: 17px;
    }
    
    .nav-btn:hover:not(.active) {
      background: #f5f5f5;
    }
    
    .main-content {
      padding: 40px;
      overflow-y: auto;
    }
    
    .main-content h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    
    .section {
      display: none;
    }
    
    .section.active {
      display: block;
    }
    
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .card {
      background: #f8f8f8;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    
    .card h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .card p {
      font-size: 13px;
      color: #999999;
      margin-bottom: 16px;
    }
    
    .price {
      font-size: 24px;
      font-weight: 700;
      color: #003366;
    }
    
    .logout-btn {
      width: calc(100% - 20px);
      margin: 0 10px;
      padding: 10px 12px;
      border: 1px solid #d0d0d0;
      background: #ffffff;
      color: #666666;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    
    .logout-btn:hover {
      border-color: #999999;
      color: #000000;
    }
    
    .sidebar-bottom {
      border-top: 1px solid #e5e5e5;
      padding-left: 20px;
      padding-top: 16px;
    }

    @media (max-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      
      .sidebar {
        display: none;
      }
      
      .grid-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.min.js"></script>
  <script>
    const { useState } = React;
    
    function AcademiaApp() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentSection, setCurrentSection] = useState('inicio');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      
      const handleLogin = (e) => {
        e.preventDefault();
        if (email && password) {
          setIsLoggedIn(true);
        }
      };
      
      const handleLogout = () => {
        setIsLoggedIn(false);
        setEmail('');
        setPassword('');
      };
      
      if (!isLoggedIn) {
        return (
          React.createElement('div', { className: 'login-container' },
            React.createElement('div', { className: 'login-box' },
              React.createElement('h1', null, 'AcademiaPL Aragón'),
              React.createElement('p', null, 'Preparación de oposiciones'),
              React.createElement('form', { onSubmit: handleLogin },
                React.createElement('div', null,
                  React.createElement('label', null, 'Email'),
                  React.createElement('input', {
                    type: 'email',
                    value: email,
                    onChange: (e) => setEmail(e.target.value),
                    placeholder: 'usuario@email.com'
                  })
                ),
                React.createElement('div', null,
                  React.createElement('label', null, 'Contraseña'),
                  React.createElement('input', {
                    type: 'password',
                    value: password,
                    onChange: (e) => setPassword(e.target.value),
                    placeholder: '••••••••'
                  })
                ),
                React.createElement('button', { type: 'submit' }, 'Acceder')
              ),
              React.createElement('div', { className: 'login-footer' },
                React.createElement('p', null, 'Te acompañamos en la preparación de tu futuro'),
                React.createElement('p', null, '25 años de experiencia en la policía')
              )
            )
          )
        );
      }
      
      return (
        React.createElement('div', { className: 'dashboard' },
          React.createElement('div', { className: 'sidebar' },
            React.createElement('div', { className: 'sidebar-header' },
              React.createElement('h2', null, 'AcademiaPL'),
              React.createElement('p', null, 'Aragón')
            ),
            React.createElement('nav', null,
              [
                { id: 'inicio', label: 'Inicio', icon: '📊' },
                { id: 'temario', label: 'Temario', icon: '📚' },
                { id: 'tests', label: 'Tests', icon: '✏️' },
                { id: 'practicos', label: 'Casos Prácticos', icon: '🔍' },
                { id: 'examenes', label: 'Exámenes Oficiales', icon: '📋' },
                { id: 'contacto', label: 'Contacto', icon: '📧' }
              ].map(item =>
                React.createElement('button', {
                  key: item.id,
                  className: `nav-btn ${currentSection === item.id ? 'active' : ''}`,
                  onClick: () => setCurrentSection(item.id)
                }, `${item.icon} ${item.label}`)
              )
            ),
            React.createElement('div', { className: 'sidebar-bottom' },
              React.createElement('button', { 
                className: 'logout-btn',
                onClick: handleLogout
              }, 'Cerrar sesión')
            )
          ),
          React.createElement('div', { className: 'main-content' },
            currentSection === 'inicio' && React.createElement('div', null,
              React.createElement('h1', null, 'Bienvenido a AcademiaPL Aragón'),
              React.createElement('p', { style: { fontSize: '16px', color: '#666666', marginBottom: '40px' } },
                'Te acompañamos en la preparación de tu futuro en la Policía Local de Aragón'
              ),
              React.createElement('div', { className: 'grid-3' },
                [
                  { title: 'Unificada', price: '19,99€/mes', desc: 'Convocatoria Unificada' },
                  { title: 'Unificada + Una', price: '29,99€/mes', desc: 'Con opción municipal' },
                  { title: 'Todo incluido', price: '39,99€/mes', desc: 'Todas las oposiciones' }
                ].map((plan, i) =>
                  React.createElement('div', { key: i, className: 'card' },
                    React.createElement('h3', null, plan.title),
                    React.createElement('p', null, plan.desc),
                    React.createElement('p', { className: 'price' }, plan.price)
                  )
                )
              )
            ),
            currentSection === 'temario' && React.createElement('div', null,
              React.createElement('h1', null, 'Temario'),
              React.createElement('p', { style: { color: '#999999', marginBottom: '32px' } },
                'Descargas en PDF organizadas por temas y bloques'
              )
            ),
            currentSection === 'tests' && React.createElement('div', null,
              React.createElement('h1', null, 'Generador de Tests'),
              React.createElement('p', { style: { color: '#666666', marginBottom: '16px' } },
                'Selecciona tema, bloque y número de preguntas'
              )
            ),
            currentSection === 'practicos' && React.createElement('div', null,
              React.createElement('h1', null, 'Casos Prácticos'),
              React.createElement('p', { style: { color: '#666666' } },
                'Casos resueltos con explicaciones detalladas'
              )
            ),
            currentSection === 'examenes' && React.createElement('div', null,
              React.createElement('h1', null, 'Exámenes Oficiales'),
              React.createElement('p', { style: { color: '#666666' } },
                'Pruebas de convocatorias anteriores'
              )
            ),
            currentSection === 'contacto' && React.createElement('div', null,
              React.createElement('h1', null, 'Contacto'),
              React.createElement('p', { style: { color: '#666666' } },
                'info@academiaplaragon.com'
              )
            )
          )
        )
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(AcademiaApp));
  </script>
</body>
</html>
